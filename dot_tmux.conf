set -g mouse on
set -g allow-rename off

 # Нумерация окон с 1
set -g base-index 1
# Нумерация панелей с 1
setw -g pane-base-index 1

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

##### 🔄 Быстрая перезагрузка конфига #####
bind r source-file ~/.tmux.conf \; display-message "Config reloaded! ✅"

# Remap splitting

# Ctrl+b \ for horizontal
bind \\ split-window -h -c "#{pane_current_path}"

# Ctrl+b - for vertical
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Закрытие панели без подтверждения
bind x kill-pane

# Увеличение шага при ресайзе
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up    resize-pane -U 5
bind -r C-Down  resize-pane -D 5


bind k confirm kill-window
bind K confirm kill-server

# Keep Ctrl+K available to applications; clear history with prefix + Ctrl+K.
unbind -n C-k
bind C-k clear-history

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour gray

# copy mode
setw -g mode-style 'fg=#111827,bg=#91a7b8,bold'

# panes
set -g pane-border-style 'fg=#475569'
set -g pane-active-border-style 'fg=#739b98'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#94a3b8,bg=default'

set -g status-left ''
set -g status-left-length 40

set -g status-right-style 'fg=#94a3b8,bg=default'
set -g status-right ' %d/%m %H:%M '
set -g status-right-length 100

setw -g window-status-current-style 'fg=#e2e8f0,bg=default,bold'
# Rounded tab ends use Powerline glyphs rendered by Ghostty.
setw -g window-status-current-format '#[fg=#476966,bg=default,nobold]#[fg=#e2e8f0,bg=#476966,bold] #I #W#{?window_zoomed_flag, [Z],} #[fg=#476966,bg=default,nobold]'

setw -g window-status-style 'fg=#a8b3c2,bg=default'
setw -g window-status-format '#[fg=#1e293b,bg=default,nobold]#[fg=#a8b3c2,bg=#1e293b] #I #W #[fg=#1e293b,bg=default]'
setw -g window-status-separator ' '

setw -g window-status-bell-style 'fg=#0f172a,bg=#b5a27b,bold'

# set -g status-right '#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'

# set -g pane-border-status bottom
# set -g pane-border-format ' #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD) #[fg=cyan]#{pane_current_path} '

# Центр: кастомный текст (tmux >= 3.2)
# set -g status-format[0] "#[align=centre]#[fg=cyan]Welcome to tmux 🚀"

# set -g status-right "CPU: #(uptime | awk -F'load average:' '{print $2}') | %Y-%m-%d %H:%M "


# messages
set -g message-style 'fg=#0f172a,bg=#91a7b8,bold'

# Keep more scrollback in new panes.
set -g history-limit 50000

# Use the default working directory for new windows.
bind c new-window

# Forward focus events to terminal applications.
set -s focus-events on

# Advertise Ghostty true color support without duplicating entries on reload.
set -s terminal-features[3] 'xterm-ghostty:RGB'

# Reserve one blank row between terminal content and the window list.
set -g status 2
set -g status-format[0] ''
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
